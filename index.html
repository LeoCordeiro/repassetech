<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Lote parado de um lado, reposição do outro. A Repasse Tech conecta lojistas com CNPJ e confere nota fiscal e IMEI antes de o lote entrar na loja." />
    <meta name="theme-color" content="%COR_TEMA%" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Repasse Tech" />
    <meta property="og:title" content="Repasse Tech · Repasse de lotes entre lojistas" />
    <meta property="og:description" content="Lote parado de um lado, reposição do outro. A Repasse Tech conecta lojistas com CNPJ e confere nota fiscal e IMEI antes de o lote entrar na loja." />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Imagem dividida em branco e petróleo, com o ícone da Repasse Tech no meio e a frase: Lote parado de um lado, reposição do outro. A gente confere no meio." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // antes de qualquer CSS: .js libera os estados de entrada; .rm espelha prefers-reduced-motion
      document.documentElement.classList.add('js')
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm')
      // quem chega na Loja pelo celular (também pelo endereço antigo, /vitrine): a foto da 1ª categoria é o LCP e o <img> só
      // nasce depois do JS — já pedida aqui
      var foto = document.querySelector('meta[name="rt-foto-loja"]')
      if (foto && window.matchMedia && matchMedia('(max-width: 639px)').matches && /^(#\/(loja|vitrine)|\/(loja|vitrine))/.test(location.hash || location.pathname)) {
        var pre = document.createElement('link')
        pre.rel = 'preload'
        pre.as = 'image'
        pre.setAttribute('imagesrcset', foto.content)
        pre.setAttribute('imagesizes', foto.getAttribute('data-sizes'))
        pre.setAttribute('fetchpriority', 'high')
        document.head.appendChild(pre)
      }
    </script>
  </head>
  <body>
    <!--SEM_JS-->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
